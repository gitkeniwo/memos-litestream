# Builds the release image from the memos version pinned in the Dockerfile.
#
# Both variants (with and without the Telegram bot) are produced by one matrix,
# mirroring canary.yml.
name: Upstream stable image

on:
  push:
    paths:
      - 'Dockerfile'
      # The litestream config and startup scripts are baked into the image, so a
      # change to them must rebuild it too -- otherwise editing etc/litestream.yml
      # silently has no effect on the published :stable tag.
      - 'etc/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-and-push-release-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # The two variants are independent; a memogram build failure should not
      # cancel the plain stable image.
      fail-fast: false
      matrix:
        include:
          - tag: stable
            suffix: ""
            use_memogram: "0"
          - tag: stable-memogram
            suffix: "-memogram"
            use_memogram: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # The version tag must come from the same place the build does, i.e. the
      # Dockerfile pin that depup maintains. Querying the memos GitHub release
      # separately would mislabel the image whenever depup's PR has not merged
      # yet -- it would tag a 0.29.1 build as 0.30.0.
      - name: Read pinned memos version from Dockerfile
        id: memos
        run: |
          version="$(sed -n 's/^ARG MEMOS_IMAGE_TAG=//p' Dockerfile)"
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo "could not read a single MEMOS_IMAGE_TAG from Dockerfile, got: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "memos version: $version"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # latest=false keeps this explicit: `:latest` is not maintained by any
          # workflow here. Use `:stable` (releases) or `:canary` (rolling dev).
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=semver,pattern={{version}},value=${{ steps.memos.outputs.version }}${{ matrix.suffix }}

      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            USE_MEMOGRAM=${{ matrix.use_memogram }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
